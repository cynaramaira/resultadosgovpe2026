<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuração Simulada 2026 — Jamildo.com</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --laranja: #f83d03;
            --laranja-glow: rgba(248, 61, 3, 0.25);
            --azul: #024796;
            --azul-glow: rgba(2, 71, 150, 0.25);
            --escuro: #0a0f1e;
            --escuro-2: #111827;
            --escuro-3: #1c2535;
            --borda: rgba(255,255,255,0.07);
            --texto: #e8eaf0;
            --texto-suave: #8892a4;
            --verde-eleito: #10b981;
            --amarelo-turno: #f59e0b;
            --fonte-display: 'Barlow Condensed', sans-serif;
            --fonte-corpo: 'Barlow', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: var(--fonte-corpo);
            background-color: var(--escuro);
            color: var(--texto);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 10;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--borda);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
        }

        .header-logo img {
            height: 32px;
            display: block;
        }

        .badge-ao-vivo {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(248, 61, 3, 0.12);
            border: 1px solid rgba(248, 61, 3, 0.4);
            border-radius: 100px;
            padding: 5px 14px 5px 10px;
            font-family: var(--fonte-display);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--laranja);
        }

        .badge-ao-vivo .dot {
            width: 7px;
            height: 7px;
            background: var(--laranja);
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        .totalizacao-wrapper {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 20px 28px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 24px;
        }

        .tot-bloco { text-align: center; }
        .tot-label {
            font-family: var(--fonte-display);
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--texto-suave);
            margin-bottom: 4px;
        }
        .tot-valor {
            font-family: var(--fonte-display);
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1;
            color: #fff;
        }
        .tot-valor.destaque { color: var(--laranja); }
        .tot-divider { width: 1px; height: 48px; background: var(--borda); }

        .tot-barra-wrap {
            grid-column: 1 / -1;
            background: rgba(255,255,255,0.06);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }
        .tot-barra-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--azul), var(--laranja));
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        /* Sistema de Abas */
        .abas-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .aba-btn {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            color: var(--texto-suave);
            font-family: var(--fonte-display);
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .aba-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
        .aba-btn.ativa { background: var(--azul); color: #fff; border-color: var(--azul); box-shadow: 0 4px 15px var(--azul-glow); }
        .aba-btn.ativa:nth-child(even) { background: var(--laranja); border-color: var(--laranja); box-shadow: 0 4px 15px var(--laranja-glow); }

        .conteudo-painel { display: none; }
        .conteudo-painel.ativo { display: block; }

        /* Cards de Apuração Estilo Dashboard */
        .card-candidato {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 0 20px;
            align-items: center;
        }

        .card-candidato:nth-child(odd) { border-left: 3px solid var(--laranja); }
        .card-candidato:nth-child(even) { border-left: 3px solid var(--azul); }

        .card-foto-wrap {
            position: relative;
            width: 68px;
            height: 68px;
            flex-shrink: 0;
        }
        .card-foto {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--escuro-3);
        }
        .card-posicao {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--fonte-display);
            font-size: 0.65rem;
            font-weight: 900;
            border: 2px solid var(--escuro-2);
            color: #fff;
            background: var(--azul);
        }
        .card-candidato:nth-child(odd) .card-posicao { background: var(--laranja); }

        .card-info { min-width: 0; }
        .card-nome {
            font-family: var(--fonte-display);
            font-size: 1.15rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-partido {
            display: inline-block;
            font-family: var(--fonte-display);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            background: rgba(255,255,255,0.08);
            color: var(--texto-suave);
        }

        .selos-container { display: flex; gap: 6px; margin-top: 4px; }
        .selo-status {
            font-family: var(--fonte-display);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            color: #fff;
        }
        .selo-status.eleito { background-color: var(--verde-eleito); }

        .card-votos { text-align: right; flex-shrink: 0; }
        .card-pct { font-family: var(--fonte-display); font-size: 2rem; font-weight: 900; line-height: 1; color: #fff; }
        .card-num-votos { font-family: var(--fonte-display); font-size: 0.75rem; color: var(--texto-suave); margin-top: 2px; }

        .barra-wrap {
            grid-column: 1 / -1;
            background: rgba(255,255,255,0.06);
            height: 5px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 12px;
        }
        .barra-fill {
            height: 100%;
            border-radius: 3px;
            width: 0%;
            background: var(--azul);
            transition: width 1s ease;
        }
        .card-candidato:nth-child(odd) .barra-fill { background: var(--laranja); }

        .estado-mensagem {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            color: var(--texto-suave);
            font-family: var(--fonte-display);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 0.75rem;
            color: var(--texto-suave);
            border-top: 1px solid var(--borda);
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">
            <img src="https://jamildo.com/media/uploads/brancologojamildo_6xe6mA0.png" alt="Logo Jamildo.com">
        </div>
        <div class="badge-ao-vivo">
            <div class="dot"></div>
            <span>Simulado TSE 2026</span>
        </div>
    </header>

    <main>
        <!-- Card de Totalização Geral -->
        <section class="totalizacao-wrapper">
            <div class="tot-bloco">
                <div class="tot-label">Seções Apuradas</div>
                <div class="tot-valor destaque" id="percentual-totalizado">0,00%</div>
            </div>
            <div class="tot-divider"></div>
            <div class="tot-bloco">
                <div class="tot-label">Horário Oficial TSE</div>
                <div class="tot-valor" id="horario-tse">00:00:00</div>
            </div>
            <div class="tot-barra-wrap">
                <div class="tot-barra-fill" id="barra-totalizacao-fill"></div>
            </div>
        </section>

        <!-- Abas de Navegação -->
        <nav class="abas-container">
            <button class="aba-btn ativa" onclick="alternarAba('0005')">Senador</button>
            <button class="aba-btn" onclick="alternarAba('0006')">Dep. Federal</button>
            <button class="aba-btn" onclick="alternarAba('0007')">Dep. Estadual</button>
        </nav>

        <!-- Container de Carregamento -->
        <div id="container-loading" class="estado-mensagem">
            <div class="texto-mensagem">Consultando servidor do simulado...</div>
        </div>

        <!-- Conteúdo das Abas -->
        <section id="painel-0005" class="conteudo-painel ativo">
            <div id="lista-candidatos"></div>
        </section>

        <section id="painel-0006" class="conteudo-painel">
            <div id="lista-candidatos-federais"></div>
        </section>

        <section id="painel-0007" class="conteudo-painel">
            <div id="lista-candidatos-estaduais"></div>
        </section>
    </main>

    <footer>
        <p>Portal jamildo.com — Cobertura Especial das Eleições 2026.</p>
    </footer>

    <script>
        const WORKER_BASE_URL = "https://tse-proxy-2026.cynaramaira.workers.dev/";
        let cargoAtivo = "0005"; // Começa em Senador (0005)
        let temporizadorAtualizacao = null;
        const memoriaHistoricoResultados = {};

        function tratarFalhaImagem(img) {
            img.onerror = null;
            img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23111827'/><text x='50%25' y='55%25' font-family='sans-serif' font-size='14' fill='%238892a4' text-anchor='middle'>FOTO</text></svg>";
        }

        function alternarAba(codigoCargo) {
            cargoAtivo = codigoCargo;
            
            document.querySelectorAll(".aba-btn").forEach((btn, index) => {
                const listaCargos = ["0005", "0006", "0007"];
                if (listaCargos[index] === codigoCargo) {
                    btn.classList.add("ativa");
                } else {
                    btn.classList.remove("ativa");
                }
            });

            // Gerencia visibilidade das seções com base no código do cargo
            document.getElementById("painel-0005").classList.toggle("ativo", codigoCargo === "0005");
            document.getElementById("painel-0006").classList.toggle("ativo", codigoCargo === "0006");
            document.getElementById("painel-0007").classList.toggle("ativo", codigoCargo === "0007");

            buscarDadosDoWorker();
        }

        // Função corrigida para chamar o Worker passando o cargo correto na URL
        async function buscarDadosDoWorker() {
            const urlCompleta = WORKER_BASE_URL + "?cargo=" + cargoAtivo;

            try {
                const resposta = await fetch(urlCompleta);
                if (!resposta.ok) {
                    throw new Error("Erro de comunicação com o Worker.");
                }

                const dadosJSON = await resposta.json();
                processarEExibir(dadosJSON);
            } catch (erro) {
                console.error("Falha na requisição:", erro);
                document.getElementById("status-apuracao-texto").textContent = "Aguardando conexão...";
            }
        }

        function processarEExibir(dados) {
            // Atualiza o horário oficial vindo do Worker
            const horarioTSE = dados.dataHora || "00:00:00";
            document.getElementById("horario-tse").textContent = horarioTSE;

            // Atualiza a porcentagem de apuração e a barra de progresso
            const progressoTexto = dados.andamento || "0,00";
            document.getElementById("percentual-totalizado").textContent = progressoTexto + "%";
            document.getElementById("barra-totalizacao-fill").style.width = progressoTexto.replace(",", ".") + "%";

            // Seções apuradas
            const secoesTotalizadas = dados.secoesTotalizadas || "0";
            const secoesTotais = dados.secoes || "0";
            document.getElementById("secoes-totalizadas").textContent = secoesTotalizadas + " / " + secoesTotais;

            const listaCandidatos = dados.cand || dados.candidatos || [];

            if (cargoAtivo === "0005") {
                renderizarCardsMajoritarios(listaCandidatos);
            } else {
                renderizarListaLegislativa(listaCandidatos);
            }

            if (progressoTexto.replace(",", ".") === "100.00") {
                clearInterval(temporizadorAtualizacao);
                document.getElementById("status-apuracao-texto").textContent = "Apuração Concluída";
            }
        }

        function renderizarCardsMajoritarios(candidatos) {
            const container = document.getElementById("lista-candidatos");
            container.innerHTML = "";

            if (candidatos.length === 0) {
                container.innerHTML = "<div class='estado-mensagem'>Aguardando dados numéricos para este cargo.</div>";
                return;
            }

            let acumularHTML = "";

            candidatos.forEach((cand, indice) => {
                const numPosicao = indice + 1;
                let htmlSelo = "";
                let htmlHora = "";

                if (cand.eleito === "E") {
                    htmlSelo = "<span class='selo-status eleito'>Eleito</span>";
                    if (!memoriaHistoricoResultados[cand.numero]) {
                        memoriaHistoricoResultados[cand.numero] = document.getElementById("horario-tse").textContent;
                    }
                    htmlHora = "<span class='hora-eleito'>Registrado às " + memoriaHistoricoResultados[cand.numero] + "</span>";
                }

                const urlFoto = cand.foto || "https://resultados-sim.tse.jus.br/simulado/simulado2026/ele2026/arquivos-comuns/fotos/pe/" + (cand.sqcand || cand.numero) + ".jpeg";
                const votosQtd = cand.votos ? cand.votos.quantidade : (cand.votosAbsolutos || 0);
                const votosPct = cand.votos ? cand.votos.porcentagem : (cand.porcentagem || "0,00");

                acumularHTML += `
                    <article class="card-candidato">
                        <div class="card-foto-wrap">
                            <img src="${urlFoto}" class="card-foto" alt="${cand.nome}" onerror="tratarFalhaImagem(this)">
                            <div class="card-posicao">${numPosicao}</div>
                        </div>
                        <div class="card-info">
                            <h2 class="card-nome">${cand.nome}</h2>
                            <span class="partido-tag">${cand.partido} | nº ${cand.numero}</span>
                            <div class="selos-container">
                                ${htmlSelo}
                                ${htmlHora}
                            </div>
                        </div>
                        <div class="card-votos">
                            <div class="card-pct">${votosPct}%</div>
                            <div class="card-num-votos">${parseInt(votosQtd).toLocaleString('pt-BR')} votos</div>
                        </div>
                        <div class="barra-wrap">
                            <div class="barra-fill" style="width: ${String(votosPct).replace(',', '.')}%"></div>
                        </div>
                    </article>
                `;
            });
            container.innerHTML = acumularHTML;
        }

        function renderizarListaLegislativa(candidatos) {
            const container = cargoAtivo === "0006" ? document.getElementById("lista-candidatos-federais") : document.getElementById("lista-candidatos-estaduais");
            container.innerHTML = "";

            if (candidatos.length === 0) {
                container.innerHTML = "<div class='estado-mensagem'>Aguardando dados numéricos para este cargo.</div>";
                return;
            }

            let acumularHTML = "";

            candidatos.forEach((cand, indice) => {
                const numPosicao = indice + 1;
                let htmlSelo = "";

                if (cand.eleito === "E") {
                    htmlSelo = " <span style='color: var(--verde-eleito); font-weight: bold; font-size: 0.8rem;'>[ELEITO]</span>";
                }

                const urlFoto = cand.foto || "https://resultados-sim.tse.jus.br/simulado/simulado2026/ele2026/arquivos-comuns/fotos/pe/" + (cand.sqcand || cand.numero) + ".jpeg";
                const votosQtd = cand.votos ? cand.votos.quantidade : (cand.votosAbsolutos || 0);
                const votosPct = cand.votos ? cand.votos.porcentagem : (cand.porcentagem || "0,00");

                acumularHTML += `
                    <article class="card-candidato">
                        <div class="card-foto-wrap">
                            <img src="${urlFoto}" class="card-foto" alt="${cand.nome}" onerror="tratarFalhaImagem(this)">
                            <div class="card-posicao">${numPosicao}</div>
                        </div>
                        <div class="card-info">
                            <h2 class="card-nome">${cand.nome}${htmlSelo}</h2>
                            <span class="partido-tag">${cand.partido} | nº ${cand.numero}</span>
                        </div>
                        <div class="card-votos">
                            <div class="card-pct">${votosPct}%</div>
                            <div class="card-num-votos">${parseInt(votosQtd).toLocaleString('pt-BR')} v.</div>
                        </div>
                        <div class="barra-wrap">
                            <div class="barra-fill" style="width: ${String(votosPct).replace(',', '.')}%"></div>
                        </div>
                    </article>
                `;
            });
            container.innerHTML = acumularHTML;
        }

        // Inicialização automática
        buscarDadosDoWorker();
        temporizadorAtualizacao = setInterval(buscarDadosDoWorker, 60000);
    </script>
</body>
</html>
