<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuração 2026 — Jamildo.com</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --laranja: #f83d03;
            --laranja-glow: rgba(248, 61, 3, 0.25);
            --azul: #024796;
            --azul-glow: rgba(2, 71, 150, 0.25);
            --escuro: #0a0f1e;
            --escuro-2: #111827;
            --escuro-3: #1c2535;
            --borda: rgba(255,255,255,0.07);
            --texto: #e8eaf0;
            --texto-suave: #8892a4;
            --verde-eleito: #10b981;
            --fonte-display: 'Barlow Condensed', sans-serif;
            --fonte-corpo: 'Barlow', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: var(--fonte-corpo);
            background-color: var(--escuro);
            color: var(--texto);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 10;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--borda);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
        }

        .header-logo img {
            height: 32px;
            display: block;
        }

        .badge-ao-vivo {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(248, 61, 3, 0.12);
            border: 1px solid rgba(248, 61, 3, 0.4);
            border-radius: 100px;
            padding: 5px 14px 5px 10px;
            font-family: var(--fonte-display);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--laranja);
        }

        .badge-ao-vivo .dot {
            width: 7px;
            height: 7px;
            background: var(--laranja);
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        .totalizacao-wrapper {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 20px 28px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 24px;
        }

        .tot-bloco { text-align: center; }
        .tot-label {
            font-family: var(--fonte-display);
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--texto-suave);
            margin-bottom: 4px;
        }
        .tot-valor {
            font-family: var(--fonte-display);
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1;
            color: #fff;
        }
        .tot-valor.destaque { color: var(--laranja); }
        .tot-divider { width: 1px; height: 48px; background: var(--borda); }

        .tot-barra-wrap {
            grid-column: 1 / -1;
            background: rgba(255,255,255,0.06);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }
        .tot-barra-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--azul), var(--laranja));
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        /* 5 Abas no Grid para caber Presidente, Governador, Senador e Deputados */
        .abas-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .aba-btn {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            color: var(--texto-suave);
            font-family: var(--fonte-display);
            font-size: 0.9rem;
            font-weight: 700;
            padding: 12px 4px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            text-align: center;
        }

        .aba-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
        .aba-btn.ativa { background: var(--azul); color: #fff; border-color: var(--azul); box-shadow: 0 4px 15px var(--azul-glow); }
        .aba-btn.ativa:nth-child(even) { background: var(--laranja); border-color: var(--laranja); box-shadow: 0 4px 15px var(--laranja-glow); }

        .conteudo-painel { display: none; }
        .conteudo-painel.ativo { display: block; }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .card-candidato {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 20px 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card-candidato:nth-child(odd) { border-left: 4px solid var(--laranja); }
        .card-candidato:nth-child(even) { border-left: 4px solid var(--azul); }

        .topo-card { display: flex; align-items: center; gap: 15px; }
        .foto-container { position: relative; width: 68px; height: 68px; flex-shrink: 0; }
        .foto-candidato { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--escuro-3); border: 2px solid var(--borda); }
        .posicao-badge {
            position: absolute; bottom: 0; right: 0; width: 22px; height: 22px;
            border-radius: 50%; background: var(--azul); color: #fff;
            font-family: var(--fonte-display); font-size: 0.75rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; border: 2px solid var(--escuro-2);
        }
        .card-candidato:nth-child(odd) .posicao-badge { background: var(--laranja); }

        .dados-identificacao { min-width: 0; }
        .nome-candidato {
            font-family: var(--fonte-display); font-size: 1.15rem; font-weight: 700;
            text-transform: uppercase; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .partido-tag {
            display: inline-block; font-family: var(--fonte-display); font-size: 0.75rem; font-weight: 700;
            background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 4px; color: var(--texto-suave); margin-top: 4px;
        }

        .selos-container { display: flex; gap: 6px; margin-top: 4px; }
        .selo-status { font-family: var(--fonte-display); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; color: #fff; }
        .selo-status.eleito { background-color: var(--verde-eleito); }

        .votos-container { margin-top: auto; }
        .votos-valores { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
        .porcentagem-votos { font-family: var(--fonte-display); font-size: 1.8rem; font-weight: 900; color: #fff; }
        .absoluto-votos { font-size: 0.85rem; color: var(--texto-suave); }

        .barra-candidato-wrap { background: rgba(255,255,255,0.05); height: 6px; border-radius: 3px; overflow: hidden; }
        .barra-candidato-preenchimento { height: 100%; width: 0%; background: var(--azul); transition: width 1s ease; }
        .card-candidato:nth-child(odd) .barra-candidato-preenchimento { background: var(--laranja); }

        /* Tabela para parlamentares */
        .tabela-legislativo { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .tabela-legislativo th { font-family: var(--fonte-display); text-transform: uppercase; font-size: 0.85rem; color: var(--texto-suave); padding: 10px 16px; text-align: left; }
        .tabela-legislativo th.dir { text-align: right; }
        .linha-candidato { background: var(--escuro-2); transition: transform 0.2s ease; }
        .linha-candidato td { padding: 12px 16px; border-top: 1px solid var(--borda); border-bottom: 1px solid var(--borda); }
        .linha-candidato td:first-child { border-left: 1px solid var(--borda); border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        .linha-candidato td:last-child { border-right: 1px solid var(--borda); border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
        .celula-perfil { display: flex; align-items: center; gap: 12px; }
        .foto-compacta { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--escuro-3); border: 1px solid var(--borda); }
        .nome-compacto { font-family: var(--fonte-display); font-size: 1rem; font-weight: 700; text-transform: uppercase; color: #fff; }
        .celula-valores { text-align: right; }
        .pct-compacta { font-family: var(--fonte-display); font-size: 1.3rem; font-weight: 700; color: #fff; }
        .abs-compacta { font-size: 0.75rem; color: var(--texto-suave); }

        .estado-mensagem {
            background: var(--escuro-2); border: 1px solid var(--borda); border-radius: 16px;
            padding: 50px 20px; text-align: center; color: var(--texto-suave);
            font-family: var(--fonte-display); text-transform: uppercase; letter-spacing: 0.08em;
        }

        footer { text-align: center; padding: 30px 20px; font-size: 0.75rem; color: var(--texto-suave); border-top: 1px solid var(--borda); margin-top: 60px; }

        @media (max-width: 650px) {
            .abas-container { grid-template-columns: repeat(2, 1fr); }
            .totalizacao-wrapper { grid-template-columns: 1fr; gap: 12px; }
            .tot-divider { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">
            <img src="https://jamildo.com/media/uploads/brancologojamildo_6xe6mA0.png" alt="Logo Jamildo.com">
        </div>
        <div class="badge-ao-vivo">
            <div class="dot"></div>
            <span>Simulado TSE 2026</span>
        </div>
    </header>

    <main>
        <section class="totalizacao-wrapper">
            <div class="tot-bloco">
                <div class="tot-label">Seções Apuradas</div>
                <div class="tot-valor destaque" id="percentual-totalizado">0,00%</div>
            </div>
            <div class="tot-divider"></div>
            <div class="tot-bloco">
                <div class="tot-label">Horário Oficial TSE</div>
                <div class="tot-valor" id="horario-tse">00:00:00</div>
            </div>
            <div class="tot-barra-wrap">
                <div class="tot-barra-fill" id="barra-totalizacao-fill"></div>
            </div>
        </section>

        <!-- 5 Abas: Presidente (0001), Governador (0003), Senador (0005), Dep. Federal (0006), Dep. Estadual (0007) -->
        <nav class="abas-container">
            <button class="aba-btn ativa" onclick="alternarAba('0001')">Presidente</button>
            <button class="aba-btn" onclick="alternarAba('0003')">Governador</button>
            <button class="aba-btn" onclick="alternarAba('0005')">Senador</button>
            <button class="aba-btn" onclick="alternarAba('0006')">Dep. Federal</button>
            <button class="aba-btn" onclick="alternarAba('0007')">Dep. Estadual</button>
        </nav>

        <div id="container-loading" class="estado-mensagem">
            <div class="texto-mensagem">Consultando servidor do simulado...</div>
        </div>

        <!-- Painéis de Conteúdo para os 5 cargos -->
        <section id="painel-0001" class="conteudo-painel ativo">
            <div class="grid-cards" id="lista-presidente"></div>
        </section>

        <section id="painel-0003" class="conteudo-painel">
            <div class="grid-cards" id="lista-governador"></div>
        </section>

        <section id="painel-0005" class="conteudo-painel">
            <div class="grid-cards" id="lista-senador"></div>
        </section>

        <section id="painel-0006" class="conteudo-painel">
            <table class="tabela-legislativo">
                <thead>
                    <tr>
                        <th>Candidato</th>
                        <th>Partido</th>
                        <th class="dir">Votação</th>
                    </tr>
                </thead>
                <tbody id="lista-federais"></tbody>
            </table>
        </section>

        <section id="painel-0007" class="conteudo-painel">
            <table class="tabela-legislativo">
                <thead>
                    <tr>
                        <th>Candidato</th>
                        <th>Partido</th>
                        <th class="dir">Votação</th>
                    </tr>
                </thead>
                <tbody id="lista-estaduais"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Portal jamildo.com — Cobertura Especial das Eleições 2026.</p>
    </footer>

    <script>
        const WORKER_BASE_URL = "https://tse-proxy-2026.cynaramaira.workers.dev/";
        let cargoAtivo = "0001"; // Começa em Presidente
        let temporizadorAtualizacao = null;
        const memoriaHistoricoResultados = {};

        function tratarFalhaImagem(img) {
            img.onerror = null;
            img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23111827'/><text x='50%25' y='55%25' font-family='sans-serif' font-size='14' fill='%238892a4' text-anchor='middle'>FOTO</text></svg>";
        }

        function alternarAba(codigoCargo) {
            cargoAtivo = codigoCargo;
            
            document.querySelectorAll(".aba-btn").forEach((btn, index) => {
                const listaCargos = ["0001", "0003", "0005", "0006", "0007"];
                if (listaCargos[index] === codigoCargo) {
                    btn.classList.add("ativa");
                } else {
                    btn.classList.remove("ativa");
                }
            });

            document.querySelectorAll(".conteudo-painel").forEach(painel => {
                painel.classList.remove("ativo");
            });
            document.getElementById("painel-" + codigoCargo).classList.add("ativo");

            buscarDadosDoWorker();
        }

        async function buscarDadosDoWorker() {
            const urlCompleta = WORKER_BASE_URL + "?cargo=" + cargoAtivo;

            try {
                const resposta = await fetch(urlCompleta);
                if (!resposta.ok) {
                    throw new Error("Erro de comunicação com o Worker.");
                }

                const dadosJSON = await resposta.json();
                processarEExibir(dadosJSON);
            } catch (erro) {
                console.error("Falha na requisição:", erro);
                document.getElementById("status-apuracao-texto").textContent = "Aguardando conexão...";
            }
        }

        function processarEExibir(dados) {
            const horarioTSE = dados.dataHora || dados.hg || "00:00:00";
            document.getElementById("horario-tse").textContent = horarioTSE;

            const progressoTexto = dados.andamento || (dados.s ? dados.s.pst : "0,00");
            document.getElementById("percentual-totalizado").textContent = progressoTexto + "%";
            document.getElementById("barra-totalizacao-fill").style.width = String(progressoTexto).replace(",", ".") + "%";

            ocultarLoading();

            // Varredura profunda na árvore do JSON do TSE (suporta raiz, carg, agr e par)
            let listaCandidatos = [];
            let dadosCargo = null;

            if (dados.carg && Array.isArray(dados.carg)) {
                dadosCargo = dados.carg.find(c => c.cd === cargoAtivo);
            } else if (dados.carg) {
                dadosCargo = dados.carg;
            } else {
                dadosCargo = dados;
            }

            if (dadosCargo) {
                // 1. Se os candidatos estiverem diretos
                if (dadosCargo.cand) {
                    const candidatosBrutos = Array.isArray(dadosCargo.cand) ? dadosCargo.cand : Object.values(dadosCargo.cand);
                    candidatosBrutos.forEach(c => listaCandidatos.push(normalizarCandidato(c)));
                } 
                // 2. Se os candidatos estiverem agrupados por coligações (agr) ou partidos (par)
                if (dadosCargo.agr) {
                    dadosCargo.agr.forEach(coligacao => {
                        if (coligacao.cand) {
                            const candColigacao = Array.isArray(coligacao.cand) ? coligacao.cand : Object.values(coligacao.cand);
                            candColigacao.forEach(c => listaCandidatos.push(normalizarCandidato(c, coligacao.sg)));
                        }
                        if (coligacao.par) {
                            coligacao.par.forEach(partido => {
                                if (partido.cand) {
                                    const candPartido = Array.isArray(partido.cand) ? partido.cand : Object.values(partido.cand);
                                    candPartido.forEach(c => listaCandidatos.push(normalizarCandidato(c, partido.sg)));
                                }
                            });
                        }
                    });
                }
            }

            // Ordena da maior votação para a menor
            listaCandidatos.sort((a, b) => b.votos.quantidade - a.votos.quantidade);

            if (cargoAtivo === "0001" || cargoAtivo === "0003" || cargoAtivo === "0005") {
                let idContainer = "lista-presidente";
                if (cargoAtivo === "0003") idContainer = "lista-governador";
                if (cargoAtivo === "0005") idContainer = "lista-senador";
                renderizarCardsMajoritarios(listaCandidatos, idContainer);
            } else {
                renderizarListaLegislativa(listaCandidatos, cargoAtivo === "0006" ? "lista-federais" : "lista-estaduais");
            }

            if (String(progressoTexto).replace(",", ".") === "100.00") {
                clearInterval(temporizadorAtualizacao);
            }
        }

        function normalizarCandidato(cand, partidoPadrao) {
            const numeroUrna = cand.n || cand.numero || "00";
            const nomeCandidato = cand.nm || cand.nome || "Candidato " + numeroUrna;
            
            let siglaPartido = partidoPadrao || "PARTIDO";
            if (cand.cc) {
                siglaPartido = cand.cc.split(" ")[0] || siglaPartido;
            } else if (cand.P) {
                siglaPartido = cand.P;
            }

            const votosQtd = parseInt(cand.vap || (cand.votos ? cand.votos.quantidade : 0)) || 0;
            const votosPct = cand.pvap || (cand.votos ? cand.votos.porcentagem : "0,00");
            
            let statusEleito = "N";
            const situacao = (cand.st || cand.e || "").toLowerCase();
            if (situacao.includes("eleito") || cand.e === "S" || cand.e === "s") {
                statusEleito = "E";
            }

            const sequencial = cand.sqcand || cand.seq || numeroUrna;
            const pastaAbrangencia = cargoAtivo === "0001" ? "br" : "pe";
            const linkFoto = `https://resultados-sim.tse.jus.br/simulado/simulado2026/ele2026/arquivos-comuns/fotos/${pastaAbrangencia}/${sequencial}.jpeg`;

            return {
                nome: nomeCandidato,
                numero: numeroUrna,
                partido: siglaPartido,
                eleito: statusEleito,
                foto: linkFoto,
                votos: {
                    quantidade: votosQtd,
                    porcentagem: votosPct
                }
            };
        }

        function renderizarCardsMajoritarios(candidatos, containerID) {
            const container = document.getElementById(containerID);
            container.innerHTML = "";

            if (candidatos.length === 0) {
                container.innerHTML = "<div class='estado-mensagem' style='grid-column: 1/-1;'>Aguardando dados numéricos para este cargo.</div>";
                return;
            }

            let acumularHTML = "";

            candidatos.forEach((cand, indice) => {
                const numPosicao = indice + 1;
                let htmlSelo = "";
                let htmlHora = "";

                if (cand.eleito === "E") {
                    htmlSelo = "<span class='selo-status eleito'>Eleito</span>";
                    if (!memoriaHistoricoResultados[cand.numero]) {
                        memoriaHistoricoResultados[cand.numero] = document.getElementById("horario-tse").textContent;
                    }
                    htmlHora = "<span class='hora-eleito'>Registrado às " + memoriaHistoricoResultados[cand.numero] + "</span>";
                }

                const pastaFoto = cargoAtivo === "0001" ? "br" : "pe";
                const urlFoto = cand.foto || "https://resultados-sim.tse.jus.br/simulado/simulado2026/ele2026/arquivos-comuns/fotos/" + pastaFoto + "/" + (cand.sqcand || cand.numero) + ".jpeg";
                const votosQtd = cand.votos ? cand.votos.quantidade : (cand.votosAbsolutos || 0);
                const votosPct = cand.votos ? cand.votos.porcentagem : (cand.porcentagem || "0,00");

                acumularHTML += `
                    <article class="card-candidato">
                        <div class="topo-card">
                            <div class="foto-container">
                                <img src="${urlFoto}" class="foto-candidato" alt="${cand.nome}" onerror="tratarFalhaImagem(this)">
                                <div class="posicao-badge">${numPosicao}</div>
                            </div>
                            <div class="dados-identificacao">
                                <h2 class="nome-candidato">${cand.nome}</h2>
                                <span class="partido-tag">${cand.partido} | nº ${cand.numero}</span>
                                <div class="selos-container">
                                    ${htmlSelo}
                                    ${htmlHora}
                                </div>
                            </div>
                        </div>
                        <div class="votos-container">
                            <div class="votos-valores">
                                <span class="porcentagem-votos">${votosPct}%</span>
                                <span class="absoluto-votos">${parseInt(votosQtd).toLocaleString('pt-BR')} votos</span>
                            </div>
                            <div class="barra-candidato-wrap">
                                <div class="barra-candidato-preenchimento" style="width: ${String(votosPct).replace(',', '.')}%"></div>
                            </div>
                        </div>
                    </article>
                `;
            });
            container.innerHTML = acumularHTML;
        }

        function renderizarListaLegislativa(candidatos, tabelaID) {
            const tabelaCorpo = document.getElementById(tabelaID);
            tabelaCorpo.innerHTML = "";

            if (candidatos.length === 0) {
                tabelaCorpo.innerHTML = "<tr><td colspan='3' class='estado-mensagem'>Aguardando dados numéricos.</td></tr>";
                return;
            }

            let acumularHTML = "";

            candidatos.forEach(cand => {
                let txtSeloLegislativo = "";
                if (cand.eleito === "E") {
                    txtSeloLegislativo = " <span style='color: var(--verde-eleito); font-weight: bold; font-size: 0.8rem;'>[ELEITO]</span>";
                }

                const urlFoto = cand.foto || "https://resultados-sim.tse.jus.br/simulado/simulado2026/ele2026/arquivos-comuns/fotos/pe/" + (cand.sqcand || cand.numero) + ".jpeg";
                const votosQtd = cand.votos ? cand.votos.quantidade : (cand.votosAbsolutos || 0);
                const votosPct = cand.votos ? cand.votos.porcentagem : (cand.porcentagem || "0,00");

                acumularHTML += `
                    <tr class="linha-candidato">
                        <td>
                            <div class="celula-perfil">
                                <img src="${urlFoto}" class="foto-compacta" alt="${cand.nome}" onerror="tratarFalhaImagem(this)">
                                <div>
                                    <div class="nome-compacto">${cand.nome}${txtSeloLegislativo}</div>
                                    <div style="font-size: 0.8rem; color: var(--texto-suave);">nº ${cand.numero}</div>
                                </div>
                            </div>
                        </td>
                        <td style="font-family: var(--fonte-display); font-weight: 700; color: var(--texto-suave);">
                            ${cand.partido}
                        </td>
                        <td class="celula-valores">
                            <div class="pct-compacta">${votosPct}%</div>
                            <div class="abs-compacta">${parseInt(votosQtd).toLocaleString('pt-BR')} v.</div>
                        </td>
                    </tr>
                `;
            });
            tabelaCorpo.innerHTML = acumularHTML;
        }

        function ocultarLoading() {
            const loader = document.getElementById("container-loading");
            if (loader) loader.style.display = "none";
        }

        // Início automático focado na aba de Presidente (0001)
        buscarDadosDoWorker();
        temporizadorAtualizacao = setInterval(buscarDadosDoWorker, 60000);
    </script>
</body>
</html>
