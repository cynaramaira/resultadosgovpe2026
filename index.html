<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuração Simulada 2026 — Jamildo.com</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --laranja: #f83d03;
            --laranja-glow: rgba(248, 61, 3, 0.25);
            --azul: #024796;
            --azul-glow: rgba(2, 71, 150, 0.25);
            --escuro: #0a0f1e;
            --escuro-2: #111827;
            --escuro-3: #1c2535;
            --borda: rgba(255,255,255,0.07);
            --texto: #e8eaf0;
            --texto-suave: #8892a4;
            --verde-eleito: #10b981;
            --amarelo-turno: #f59e0b;
            --fonte-display: 'Barlow Condensed', sans-serif;
            --fonte-corpo: 'Barlow', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: var(--fonte-corpo);
            background-color: var(--escuro);
            color: var(--texto);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 10;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--borda);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
        }

        .header-logo img {
            height: 32px;
            display: block;
        }

        .badge-ao-vivo {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(248, 61, 3, 0.12);
            border: 1px solid rgba(248, 61, 3, 0.4);
            border-radius: 100px;
            padding: 5px 14px 5px 10px;
            font-family: var(--fonte-display);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--laranja);
        }

        .badge-ao-vivo .dot {
            width: 7px;
            height: 7px;
            background: var(--laranja);
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        .totalizacao-wrapper {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 20px 28px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 24px;
        }

        .tot-bloco { text-align: center; }
        .tot-label {
            font-family: var(--fonte-display);
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--texto-suave);
            margin-bottom: 4px;
        }
        .tot-valor {
            font-family: var(--fonte-display);
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1;
            color: #fff;
        }
        .tot-valor.destaque { color: var(--laranja); }
        .tot-divider { width: 1px; height: 48px; background: var(--borda); }

        .tot-barra-wrap {
            grid-column: 1 / -1;
            background: rgba(255,255,255,0.06);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }
        .tot-barra-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--azul), var(--laranja));
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        /* Sistema de Abas */
        .abas-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .aba-btn {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            color: var(--texto-suave);
            font-family: var(--fonte-display);
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .aba-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
        .aba-btn.ativa { background: var(--azul); color: #fff; border-color: var(--azul); box-shadow: 0 4px 15px var(--azul-glow); }
        .aba-btn.ativa:nth-child(even) { background: var(--laranja); border-color: var(--laranja); box-shadow: 0 4px 15px var(--laranja-glow); }

        .conteudo-painel { display: none; }
        .conteudo-painel.ativo { display: block; }

        /* Cards de Apuração Estilo Dashboard */
        .card-candidato {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 0 20px;
            align-items: center;
        }

        .card-candidato:nth-child(odd) { border-left: 3px solid var(--laranja); }
        .card-candidato:nth-child(even) { border-left: 3px solid var(--azul); }

        .card-foto-wrap {
            position: relative;
            width: 68px;
            height: 68px;
            flex-shrink: 0;
        }
        .card-foto {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--escuro-3);
        }
        .card-posicao {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--fonte-display);
            font-size: 0.65rem;
            font-weight: 900;
            border: 2px solid var(--escuro-2);
            color: #fff;
            background: var(--azul);
        }
        .card-candidato:nth-child(odd) .card-posicao { background: var(--laranja); }

        .card-info { min-width: 0; }
        .card-nome {
            font-family: var(--fonte-display);
            font-size: 1.15rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-partido {
            display: inline-block;
            font-family: var(--fonte-display);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            background: rgba(255,255,255,0.08);
            color: var(--texto-suave);
        }

        .selos-container { display: flex; gap: 6px; margin-top: 4px; }
        .selo-status {
            font-family: var(--fonte-display);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            color: #fff;
        }
        .selo-status.eleito { background-color: var(--verde-eleito); }

        .card-votos { text-align: right; flex-shrink: 0; }
        .card-pct { font-family: var(--fonte-display); font-size: 2rem; font-weight: 900; line-height: 1; color: #fff; }
        .card-num-votos { font-family: var(--fonte-display); font-size: 0.75rem; color: var(--texto-suave); margin-top: 2px; }

        .barra-wrap {
            grid-column: 1 / -1;
            background: rgba(255,255,255,0.06);
            height: 5px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 12px;
        }
        .barra-fill {
            height: 100%;
            border-radius: 3px;
            width: 0%;
            background: var(--azul);
            transition: width 1s ease;
        }
        .card-candidato:nth-child(odd) .barra-fill { background: var(--laranja); }

        .estado-mensagem {
            background: var(--escuro-2);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            color: var(--texto-suave);
            font-family: var(--fonte-display);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 0.75rem;
            color: var(--texto-suave);
            border-top: 1px solid var(--borda);
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">
            <img src="https://jamildo.com/media/uploads/brancologojamildo_6xe6mA0.png" alt="Logo Jamildo.com">
        </div>
        <div class="badge-ao-vivo">
            <div class="dot"></div>
            <span>Simulado TSE 2026</span>
        </div>
    </header>

    <main>
        <!-- Card de Totalização Geral -->
        <section class="totalizacao-wrapper">
            <div class="tot-bloco">
                <div class="tot-label">Seções Apuradas</div>
                <div class="tot-valor destaque" id="percentual-totalizado">0,00%</div>
            </div>
            <div class="tot-divider"></div>
            <div class="tot-bloco">
                <div class="tot-label">Horário Oficial TSE</div>
                <div class="tot-valor" id="horario-tse">00:00:00</div>
            </div>
            <div class="tot-barra-wrap">
                <div class="tot-barra-fill" id="barra-totalizacao-fill"></div>
            </div>
        </section>

        <!-- Abas de Navegação -->
        <nav class="abas-container">
            <button class="aba-btn ativa" onclick="alternarAba('0005')">Senador</button>
            <button class="aba-btn" onclick="alternarAba('0006')">Dep. Federal</button>
            <button class="aba-btn" onclick="alternarAba('0007')">Dep. Estadual</button>
        </nav>

        <!-- Container de Carregamento -->
        <div id="container-loading" class="estado-mensagem">
            <div class="texto-mensagem">Consultando servidor do simulado...</div>
        </div>

        <!-- Conteúdo das Abas -->
        <section id="painel-0005" class="conteudo-painel ativo">
            <div id="lista-candidatos"></div>
        </section>

        <section id="painel-0006" class="conteudo-painel">
            <div id="lista-candidatos-federais"></div>
        </section>

        <section id="painel-0007" class="conteudo-painel">
            <div id="lista-candidatos-estaduais"></div>
        </section>
    </main>

    <footer>
        <p>Portal jamildo.com — Cobertura Especial das Eleições 2026.</p>
    </footer>

    <script>
        const WORKER_BASE_URL = "https://tse-2022-teste.cynaramaira.workers.dev/";
        let cargoAtivo = "0005";
        let temporizadorAtualizacao = null;
        const memoriaHistoricoResultados = {};

        function tratarFalhaImagem(img) {
            img.onerror = null;
            img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23111827'/><text x='50%25' y='55%25' font-family='sans-serif' font-size='14' fill='%238892a4' text-anchor='middle'>FOTO</text></svg>";
        }

        function alternarAba(codigoCargo) {
            cargoAtivo = codigoCargo;
            
            document.querySelectorAll(".aba-btn").forEach((btn, index) => {
                const listaCargos = ["0005", "0006", "0007"];
                if (listaCargos[index] === codigoCargo) {
                    btn.classList.add("ativa");
                } else {
                    btn.classList.remove("ativa");
                }
            });

            document.querySelectorAll(".conteudo-painel").forEach(painel => {
                if (painel.id === "painel-" + (codigoCargo === "0005" ? "senador" : (codigoCargo === "0006" ? "deputado-federal" : "deputado-estadual"))) {
                    painel.classList.add("ativo");
                } else {
                    painel.classList.remove("ativo");
                }
            });

            // Ajuste dinâmico do ID do painel ativo
            if(codigoCargo === "0005") {
                document.getElementById("painel-0005").classList.add("ativo");
                document.getElementById("painel-0006").classList.remove("ativo");
                document.getElementById("painel-0007").classList.remove("ativo");
            } else if(codigoCargo === "0006") {
                document.getElementById("painel-0005").classList.remove("ativo");
                document.getElementById("painel-0006").classList.add("ativo");
                document.getElementById("painel-0007").classList.remove("ativo");
            } else {
                document.getElementById("painel-0005").classList.remove("ativo");
                document.getElementById("painel-0006").classList.remove("ativo");
                document.getElementById("painel-0007").classList.add("ativo");
            }

            buscarDadosSimulado();
        }

        async function buscarDadosSimulado() {
            const urlCompleta = WORKER_BASE_URL + "?cargo=" + cargoAtivo;

            try {
                const resposta = await fetch(urlCompleta);
                if (!resposta.ok) {
                    throw new Error("Erro de comunicação com o simulado.");
                }

                const dadosJSON = await resposta.json();
                processarEExibir(dadosJSON);
            } catch (erro) {
                console.error("Falha no fetch:", erro);
                document.getElementById("container-loading").innerHTML = "Aguardando liberação da base de dados pelo TSE...";
            }
        }

        function processarEExibir(dados) {
            // Horário oficial direto do servidor do TSE (campos hg ou ht)
            const horaOficialTSE = dados.ht || (dados.hg || "00:00:00");
            document.getElementById("horario-tse").textContent = horaOficialTSE;

            // Percentual de seções totalizadas (pst)
            let percentualStr = "0,00";
            if (dados.s && dados.s.pst) {
                percentualStr = dados.s.pst;
            } else if (dados.pst) {
                percentualStr = dados.pst;
            }
            document.getElementById("percentual-totalizado").textContent = percentualStr + "%";
            document.getElementById("barra-totalizacao-fill").style.width = percentualStr.replace(",", ".") + "%";

            // Localiza o bloco do cargo ativo no JSON unificado
            let dadosCargo = null;
            if (dados.carg && Array.isArray(dados.carg)) {
                dadosCargo = dados.carg.find(c => c.cd === cargoAtivo);
            } else if (dados.carg) {
                dadosCargo = dados.carg;
            } else {
                dadosCargo = dados;
            }

            let listaCandidatos = [];

            // Varredura segura na árvore unificada do TSE
            if (dadosCargo && dadosCargo.cand) {
                const arrCand = Object.values(dadosCargo.cand);
                arrCand.forEach(cand => {
                    listaCandidatos.push(estruturarCandidato(cand, horaOficialTSE));
                });
            } else if (dadosCargo && dadosCargo.agr) {
                dadosCargo.agr.forEach(coligacao => {
                    if (coligacao.cand) {
                        Object.values(coligacao.cand).forEach(cand => {
                            listaCandidatos.push(estruturarCandidato(cand, horaOficialTSE, coligacao.sg));
                        });
                    }
                    if (coligacao.par) {
                        coligacao.par.forEach(partido => {
                            if (partido.cand) {
                                Object.values(partido.cand).forEach(cand => {
                                    listaCandidatos.push(estruturarCandidato(cand, horaOficialTSE, partido.sg));
                                });
                            }
                        });
                    }
                });
            }

            // Ordena do mais votado para o menos votado
            listaCandidatos.sort((a, b) => b.votosAbsolutos - a.votosAbsolutos);

            document.getElementById("container-loading").style.display = "none";
            renderizarInterface(listaCandidatos);

            if (percentualStr.replace(",", ".") === "100.00") {
                clearInterval(temporizadorAtualizacao);
                document.getElementById("status-apuracao-texto").textContent = "Apuração Concluída";
            }
        }

        function estruturarCandidato(cand, horaOficialTSE, partidoPadrao) {
            const numeroUrna = cand.n || "00";
            const idSequencial = cand.sqcand || cand.seq || "";
            const nomeCandidato = cand.nm || "Candidato " + numeroUrna;
            
            let partidoSigla = partidoPadrao || "PARTIDO";
            if (cand.cc) {
                partidoSigla = cand.cc.split(" ")[0] || partidoSigla;
            }

            const votosValores = parseInt(cand.vap) || 0;
            const pctValores = cand.pvap || "0,00";

            let situacao = "";
            if (cand.st) {
                situacao = cand.st.toLowerCase().trim();
            } else if (cand.e) {
                situacao = cand.e.toLowerCase().trim();
            }

            let statusFormatado = "";
            if (situacao.includes("eleito") || cand.e === "s" || cand.e === "S") {
                statusFormatado = "eleito";
                if (!memoriaHistoricoResultados[idSequencial]) {
                    memoriaHistoricoResultados[idSequencial] = horaOficialTSE;
                }
            }

            // URL oficial da foto do candidato no servidor do TSE
            const urlFotoCandidato = "https://resultados-sim.tse.jus.br/simulado/simulado2026/ele2026/arquivos-comuns/fotos/pe/" + idSequencial + ".jpeg";

            return {
                id: idSequencial,
                numero: numeroUrna,
                nome: nomeCandidato,
                partido: partidoSigla,
                votosAbsolutos: votosValores,
                porcentagem: pctValores,
                status: statusFormatado,
                foto: urlFotoCandidato
            };
        }

        function renderizarInterface(candidatos) {
            let containerAlvoID = "lista-senadores";
            if (cargoAtivo === "0006") containerAlvoID = "lista-candidatos-federais";
            if (cargoAtivo === "0007") containerAlvoID = "lista-candidatos-estaduais";

            // Se for federal ou estadual, redireciona o renderizador para as respectivas seções se necessário
            let container = document.getElementById(cargoAtivo === "0005" ? "lista-senadores" : (cargoAtivo === "0006" ? "lista-candidatos-federais" : "lista-candidatos-estaduais"));
            container.innerHTML = "";

            if (candidatos.length === 0) {
                container.innerHTML = "<div class='estado-mensagem'>Aguardando dados numéricos para este cargo.</div>";
                return;
            }

            let acumularHTML = "";

            candidatos.forEach((cand, indice) => {
                const posicao = indice + 1;
                let htmlSelo = "";
                let htmlHora = "";

                if (cand.status === "eleito") {
                    htmlSelo = "<span class='selo-status eleito'>Eleito</span>";
                    const horarioGravado = memoriaHistoricoResultados[cand.id] || "Confirmado";
                    htmlHora = "<span class='hora-eleito'>Registrado às " + horarioGravada + "</span>";
                }

                acumularHTML += `
                    <article class="card-candidato">
                        <div class="card-foto-wrap">
                            <img src="${cand.foto}" class="card-foto" alt="${cand.nome}" onerror="tratarFalhaImagem(this)">
                            <div class="card-posicao">${posicao}</div>
                        </div>
                        <div class="card-info">
                            <h2 class="card-nome">${cand.nome}</h2>
                            <span class="partido-tag">${cand.partido} | nº ${cand.numero}</span>
                            <div class="selos-container">
                                ${htmlSelo}
                                ${htmlHora}
                            </div>
                        </div>
                        <div class="card-votos">
                            <div class="card-pct">${cand.porcentagem}%</div>
                            <div class="card-num-votos">${cand.votosAbsolutos.toLocaleString('pt-BR')} votos</div>
                        </div>
                        <div class="barra-wrap">
                            <div class="barra-fill" style="width: ${cand.porcentagem.replace(',', '.')}%"></div>
                        </div>
                    </article>
                `;
            });
            container.innerHTML = acumularHTML;
        }

        // Inicialização e Temporizador de 60 segundos respeitando as normas do TSE
        buscarDadosSimulado();
        temporizadorAtualizacao = setInterval(buscarDadosSimulado, 60000);
    </script>
</body>
</html>
